name: Automated Daily CTI Collection

on:
  schedule:
    # Runs daily at 06:00 UTC (07:00 AM Moroccan Time UTC+1)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  collect-and-sync:
    name: Execute Daily Collectors & Sync Dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Threat Intelligence Collection Pipeline
        env:
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
        run: |
          python run_daily_collection.py

      - name: Verify Data Ingestion & Storage Integrity
        run: |
          python -m pytest -v tests/test_validate.py tests/test_repository.py tests/test_repository_sqlite.py

      - name: Commit and Push Updated Dataset & Run History
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): automated daily CTI collection [skip ci]"
          file_pattern: "data/threat_events.csv reports/*.md"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
